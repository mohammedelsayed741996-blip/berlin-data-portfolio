name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solar-loan-credit-risk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: climate-tech-energy-finance/solar-loan-credit-risk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the pipeline end to end
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: python -m solar_credit.pipeline --regenerate

  saas-revenue-elt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: b2b-saas-data-platforms/saas-revenue-elt
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      EVENT_HASH_SALT: ${{ secrets.EVENT_HASH_SALT || 'ci-only-salt' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the 93-day pipeline simulation
        run: python -m saas_elt.cli simulate --workdir workdir --fresh --output ci_outputs

  saas-revenue-elt-dbt-duckdb:
    # Same dbt project, real dbt, second engine: proves the models are portable.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b2b-saas-data-platforms/saas-revenue-elt
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dbt.txt
      - name: Load the raw layer (simulation)
        run: python -m saas_elt.cli simulate --workdir workdir --fresh --output ci_outputs
      - name: Copy raw tables to DuckDB
        run: python scripts/export_raw_to_duckdb.py workdir/warehouse/warehouse.db ci_warehouse.duckdb
      - name: dbt build on DuckDB
        working-directory: b2b-saas-data-platforms/saas-revenue-elt/dbt_project
        env:
          DBT_DUCKDB_PATH: ../ci_warehouse.duckdb
        run: |
          set -o pipefail
          dbt build --profiles-dir . --vars '{run_date: "2026-09-30"}' 2>&1 | tee dbt.log || {
            grep -E "Error|ERROR|FAIL|Compilation" dbt.log | head -15 | while read -r line; do echo "::error::${line}"; done
            exit 1
          }

  month-end-close-forecast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: agritech-corporate-finance/month-end-close-forecast
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the close and forecast end to end
        run: python -m close_forecast.pipeline --regenerate

  credit-downgrade-early-warning:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: consulting-financial-services/credit-downgrade-early-warning
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the pipeline end to end
        run: python -m downgrade_ews.pipeline --regenerate

  aml-monitoring-oversight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: fintech-brokerage/aml-monitoring-oversight
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the oversight pipeline end to end
        run: python -m aml_oversight.pipeline --regenerate

  bus-network-demand-planning:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: mobility/bus-network-demand-planning
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the planning pipeline end to end
        run: python -m bus_network.pipeline --regenerate

  time-preference-choice-models:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: academic-research/time-preference-choice-models
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the analysis pipeline
        run: python -m timepref.pipeline

  time-preference-r-replication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academic-research/time-preference-choice-models
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install pandas numpy
      - name: Fit the hyperbolic model in base R
        run: Rscript r/fit_hyperbolic.R data outputs/hyperbolic_fits_r.csv
      - name: Compare R and Python estimates
        run: python scripts/compare_r_python.py
