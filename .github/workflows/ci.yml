name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solar-loan-credit-risk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: climate-tech-energy-finance/solar-loan-credit-risk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the pipeline end to end
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: python -m solar_credit.pipeline --regenerate
