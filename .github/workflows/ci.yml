name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  solar-loan-credit-risk:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: climate-tech-energy-finance/solar-loan-credit-risk
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the pipeline end to end
        env:
          PYTHONPATH: src
          MPLBACKEND: Agg
        run: python -m solar_credit.pipeline --regenerate

  saas-revenue-elt:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: b2b-saas-data-platforms/saas-revenue-elt
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
      EVENT_HASH_SALT: ${{ secrets.EVENT_HASH_SALT || 'ci-only-salt' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the 93-day pipeline simulation
        run: python -m saas_elt.cli simulate --workdir workdir --fresh --output ci_outputs

  saas-revenue-elt-dbt-duckdb:
    # Same dbt project, real dbt, second engine: proves the models are portable.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b2b-saas-data-platforms/saas-revenue-elt
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dbt.txt
      - name: Load the raw layer (simulation)
        run: python -m saas_elt.cli simulate --workdir workdir --fresh --output ci_outputs
      - name: Copy raw tables to DuckDB
        run: python scripts/export_raw_to_duckdb.py workdir/warehouse/warehouse.db ci_warehouse.duckdb
      - name: dbt build on DuckDB
        working-directory: b2b-saas-data-platforms/saas-revenue-elt/dbt_project
        env:
          DBT_DUCKDB_PATH: ../ci_warehouse.duckdb
        run: |
          set -o pipefail
          dbt build --profiles-dir . --vars '{run_date: "2026-09-30"}' 2>&1 | tee dbt.log || {
            grep -E "Error|ERROR|FAIL|Compilation" dbt.log | head -15 | while read -r line; do echo "::error::${line}"; done
            exit 1
          }

  month-end-close-forecast:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: agritech-corporate-finance/month-end-close-forecast
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the close and forecast end to end
        run: python -m close_forecast.pipeline --regenerate

  credit-downgrade-early-warning:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: consulting-financial-services/credit-downgrade-early-warning
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the pipeline end to end
        run: python -m downgrade_ews.pipeline --regenerate

  aml-monitoring-oversight:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: fintech-brokerage/aml-monitoring-oversight
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the oversight pipeline end to end
        run: python -m aml_oversight.pipeline --regenerate

  bus-network-demand-planning:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: mobility/bus-network-demand-planning
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the planning pipeline end to end
        run: python -m bus_network.pipeline --regenerate

  time-preference-choice-models:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: academic-research/time-preference-choice-models
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: python -m pytest -q
      - name: Run the analysis pipeline
        run: python -m timepref.pipeline

  time-preference-r-replication:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: academic-research/time-preference-choice-models
    steps:
      - uses: actions/checkout@v5
      - uses: r-lib/actions/setup-r@v2
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Python dependencies
        run: pip install pandas numpy
      - name: Fit the hyperbolic model in base R
        run: Rscript r/fit_hyperbolic.R data outputs/hyperbolic_fits_r.csv
      - name: Compare R and Python estimates
        run: python scripts/compare_r_python.py

  hr-policy-rag-assistant:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: hr-tech/hr-policy-rag-assistant
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hrrag
          POSTGRES_USER: hrrag
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U hrrag -d hrrag" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-postgres.txt
      - name: Run tests, including PostgreSQL
        env:
          DATABASE_URL: postgresql://hrrag:ci-only-password@localhost:5432/hrrag
        run: python -m pytest -q
      - name: Evaluation gate on held-out questions
        run: python scripts/evaluate.py --gate

  hr-policy-rag-web-and-container:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hr-tech/hr-policy-rag-assistant
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Type-check the TypeScript front end
        working-directory: hr-tech/hr-policy-rag-assistant/web
        run: npm install --no-audit --no-fund && npx tsc -p tsconfig.json --noEmit
      - name: Build the Docker image
        run: docker build -t hr-policy-assistant:ci .
      - name: Start the container and ask it a question
        run: |
          docker run -d --name hrrag -p 8000:8000 hr-policy-assistant:ci
          for i in $(seq 1 30); do curl -fs http://localhost:8000/health && break; sleep 1; done
          curl -fs http://localhost:8000/health
          answer=$(curl -fs -X POST http://localhost:8000/api/ask -H 'Content-Type: application/json' \
            -d '{"question": "How long can I take Elternzeit?", "session": "ci"}')
          echo "$answer"
          echo "$answer" | grep -q "three years"
          curl -fs http://localhost:8000/ | grep -q "HR policy assistant"
          curl -fs http://localhost:8000/static/app.js > /dev/null
      - name: Container logs
        if: always()
        run: docker logs hrrag || true

  agentic-lakehouse:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: b2b-saas-data-platforms/agentic-lakehouse-reference-architecture
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-aws.txt
      - name: Run tests (lakehouse is rebuilt from scratch)
        run: python -m pytest -q
      - name: Release gate - task evaluation and red team
        run: python scripts/evaluate.py --gate
      - name: Container smoke test
        if: matrix.python-version == '3.12'
        run: |
          docker build -t agentic-lakehouse .
          docker run -d --name al -p 8000:8000 agentic-lakehouse
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
          curl -sf localhost:8000/api/agent -H 'X-User-Id: AM02' -H 'X-User-Role: account_manager' \
               -H 'Content-Type: application/json' -d '{"question": "What does Elbtal Maschinenbau owe us?"}' | tee /dev/stderr | grep -q "A002"
          docker rm -f al

  agentic-lakehouse-terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: b2b-saas-data-platforms/agentic-lakehouse-reference-architecture/infra/terraform
    steps:
      - uses: actions/checkout@v5
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format check
        run: terraform fmt -check -recursive -diff
      - name: Init without a backend
        run: terraform init -backend=false -input=false
      - name: Validate
        run: terraform validate

  procurement-spend-analytics:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: energy-grid-technology/procurement-spend-analytics
    env:
      PYTHONPATH: src
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests (exports regenerated from scratch)
        run: python -m pytest -q
      - name: Run the pipeline end to end and check every planted problem is found
        run: |
          python -m spendcube.pipeline --regenerate > /tmp/result.json
          python -c "import json; r=json.load(open('/tmp/result.json')); assert r['data_quality']['all_planted_found'], r['data_quality']; assert r['supplier_matching']['false_merges'] == 0"
      - name: Committed data matches the generator
        run: git diff --exit-code -- data/raw data/model
