apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hr-policy-assistant
  labels: {app: hr-policy-assistant}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: hr-policy-assistant
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
